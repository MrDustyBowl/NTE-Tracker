name: Validate owned NTE assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/manifest.v1.json'
      - 'assets/characters/**'
      - 'assets/arcs/**'
      - 'assets/items/**'
      - 'assets/elements/**'
      - 'src/assets/characters/avatars/**'
      - 'scripts/check-assets.cjs'
      - '.github/workflows/validate-assets.yml'
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-assets.cjs
