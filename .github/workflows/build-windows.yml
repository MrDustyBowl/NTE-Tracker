name: NTE v2 — Windows installer (development)
on:
  workflow_dispatch:
  push:
    branches: [v2-development]
permissions:
  contents: read
concurrency:
  group: nte-v2-windows
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify release version and catalogue tests
        run: |
          node scripts/prepare-v2-live.cjs
          node test-catalog-v2.cjs
          node --check src/catalog-main.js
      - name: Check signed updater settings
        run: node scripts/validate-updater-config.cjs
      - name: Test Rust database and sync validation
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows signed installer
        run: npm run tauri build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: NTE-Tracker-v2-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
